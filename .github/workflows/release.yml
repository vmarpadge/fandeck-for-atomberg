name: Build & Release menu bar app

# Builds "FanDeck for Atomberg.app" (menu bar) on a macOS runner and attaches a zip to
# the GitHub Release when you push a version tag (e.g. v1.0.0). You can also run
# it manually from the Actions tab to just produce a downloadable artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to upload assets to the release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the menu bar app
        working-directory: AtombergFans
        env:
          BUNDLE_ID_PREFIX: io.github.${{ github.repository_owner }}
        run: ./build-menubar.sh

      - name: Zip the app
        working-directory: AtombergFans/build
        run: ditto -c -k --keepParent "FanDeck for Atomberg.app" "FanDeck-for-Atomberg.zip"

      - name: Upload build artifact (always, even without a tag)
        uses: actions/upload-artifact@v4
        with:
          name: FanDeck-for-Atomberg-app
          path: AtombergFans/build/FanDeck-for-Atomberg.zip

      - name: Attach to the GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AtombergFans/build/FanDeck-for-Atomberg.zip
          body: |
            Pre-built menu bar app. The build is **ad-hoc signed** (not notarised), so
            the first launch needs a manual override:

            1. Unzip and move **FanDeck for Atomberg.app** to `~/Applications`.
            2. Right-click the app → **Open** → **Open** again at the prompt
               (or allow it under *System Settings → Privacy & Security*).
            3. Add your API key and refresh token in the menu, then control your fans.

            See the README for setup details.
